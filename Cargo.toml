[package]
name = "signal-knowledge-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15"
pdf-extract = "0.12.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
